# ① 镜头/视角要素：地面极低仰拍
element: camera
id: low_angle_floor
name_zh: "地面极低仰拍"
name_en: "Low-Angle Floor Shot"
tags: [low_angle, dramatic, nsfw_friendly, L2, L3]
boldness_boost: "+1"

prompt: >-
  A hyper-realistic, low-angle shot from floor level looking up,

variants:
