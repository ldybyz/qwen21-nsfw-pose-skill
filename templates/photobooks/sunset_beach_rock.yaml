id: sunset_beach_rock
name_zh: "潮汐礁石·落日暮光写真套图"
description: "5幕海岛自然光影大片写真，琥珀晚霞落日熔金、潮汐浪沫微漾、湿发与微观盐晶水光，融合野性自然与极致肉体张力"
scene_reference: "prompts/scene_sunset_beach_rock.txt"

# 默认基础参数
default_params:
  lora: "qwen2_1-femaledVaginus-nsfw-v1_3-fine_L22-31.safetensors"
  lora_strength: 1.0
  cfg: 2.5
